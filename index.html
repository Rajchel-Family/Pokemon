<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Base Set">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14161c">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>Base Set Tracker</title>
<style>
  :root{--bg:#14161c;--card:#1e222b;--line:#2c313c;--text:#f2f4f8;--dim:#8b93a3;--have:#2ecc71;--need:#e74c3c;--accent:#ffcb05}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px 8px;border-bottom:1px solid var(--line)}
  h1{font-size:18px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
  h1 small{color:var(--dim);font-weight:500;font-size:13px}
  .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
  .bar>div{height:100%;background:var(--have);width:0;transition:width .25s}
  .tabs{display:flex;gap:6px;margin-top:10px}
  .tabs button{flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--dim);font-size:14px;font-weight:600}
  .tabs button.on{background:var(--accent);color:#111;border-color:var(--accent)}
  .group{padding:8px 14px 0;color:var(--dim);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 10px}
  .c{position:relative;background:var(--card);border:2px solid var(--need);border-radius:12px;padding:0;color:var(--text);text-align:center;overflow:hidden;display:flex;flex-direction:column}
  .c.have{border-color:var(--have)}
  .c .img{width:100%;aspect-ratio:5/7;background:#0d0f13 center/contain no-repeat;filter:grayscale(1) brightness(.45);transition:filter .2s}
  .c.have .img{filter:none}
  .c .meta{padding:3px 2px;font-size:9px;line-height:1.2}
  .c .meta b{display:block;color:var(--dim);font-size:9px}
  .c .meta span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c .tick{position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:var(--need);color:#fff;font-size:10px;line-height:16px;font-weight:800}
  .c.have .tick{background:var(--have)}
  .holo{position:absolute;top:3px;left:3px;background:var(--accent);color:#111;font-size:7px;font-weight:800;padding:1px 3px;border-radius:4px}
  .empty{padding:30px;text-align:center;color:var(--dim)}
  @media (min-width:480px){.grid{grid-template-columns:repeat(5,1fr)}}
  @media (min-width:600px){.grid{grid-template-columns:repeat(6,1fr)}}
  @media (min-width:800px){.grid{grid-template-columns:repeat(8,1fr)}}
  footer{padding:18px 14px calc(24px + env(safe-area-inset-bottom));text-align:center}
  footer button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:8px 12px;font-size:12px;margin:0 4px}
  /* Pricing sheet */
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .overlay.show{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:#1e222b;border-radius:20px 20px 0 0;padding-bottom:calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.32,0,.15,1);max-height:88vh;overflow-y:auto;will-change:transform}
  .sheet.show{transform:translateY(0)}
  .sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--line);margin:12px auto 4px}
  .sheet-head{display:flex;gap:12px;align-items:flex-start;padding:10px 16px 14px}
  .sheet-img{width:72px;height:100px;border-radius:8px;background:#0d0f13 center/contain no-repeat;flex-shrink:0;border:1px solid var(--line)}
  .sheet-info{flex:1;min-width:0;padding-top:4px}
  .sheet-info h2{font-size:17px;font-weight:700;margin:0 0 2px}
  .sheet-info p{font-size:12px;color:var(--dim);margin:0 0 6px}
  .sheet-badge{display:inline-block;background:var(--accent);color:#111;font-size:9px;font-weight:800;padding:2px 5px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em}
  .sheet-section{padding:0 16px 16px}
  .sheet-section h3{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px;border-top:1px solid var(--line);padding-top:14px}
  .price-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .price-cell{background:#14161c;border-radius:10px;padding:10px 6px;text-align:center}
  .price-cell .label{font-size:10px;color:var(--dim);font-weight:600;margin-bottom:4px}
  .price-cell .amount{font-size:16px;font-weight:700;color:var(--text)}
  .price-cell .amount.nil{color:var(--line);font-size:13px}
  .graded-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
  .graded-row.last{grid-template-columns:repeat(2,1fr)}
  .price-cell.grade .label{color:var(--accent)}
  .pro-note{background:#14161c;border-radius:10px;padding:12px;text-align:center;color:var(--dim);font-size:12px;line-height:1.5}
  .pro-note a{color:var(--accent);text-decoration:none}
  .sheet-loading{padding:40px 16px;text-align:center;color:var(--dim);font-size:14px}
  .sheet-error{padding:30px 16px;text-align:center;color:var(--need);font-size:13px}
</style>
</head>
<body>
<header>
  <h1>Base Set <small id="count"></small></h1>
  <div class="bar"><div id="fill"></div></div>
  <div class="tabs" id="tabs">
    <button data-f="all" class="on">All</button>
    <button data-f="need">Need</button>
    <button data-f="have">Have</button>
  </div>
</header>
<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div id="sheet-body"></div>
</div>
<main id="main"></main>
<footer>
  <button id="exp">Copy need-list</button>
  <button id="rst">Reset</button>
</footer>
<script>
const NAMES="Alakazam,Blastoise,Chansey,Charizard,Clefairy,Gyarados,Hitmonchan,Machamp,Magneton,Mewtwo,Nidoking,Ninetales,Poliwrath,Raichu,Venusaur,Zapdos,Beedrill,Dragonair,Dugtrio,Electabuzz,Electrode,Pidgeotto,Arcanine,Charmeleon,Dewgong,Dratini,Farfetch'd,Growlithe,Haunter,Ivysaur,Jynx,Kadabra,Kakuna,Machoke,Magikarp,Magmar,Nidorino,Poliwhirl,Porygon,Raticate,Seel,Wartortle,Abra,Bulbasaur,Caterpie,Charmander,Diglett,Doduo,Drowzee,Gastly,Koffing,Machop,Magnemite,Metapod,Nidoran ♂,Onix,Pidgey,Pikachu,Poliwag,Ponyta,Rattata,Sandshrew,Squirtle,Starmie,Staryu,Tangela,Voltorb,Vulpix,Weedle,Clefairy Doll,Computer Search,Devolution Spray,Impostor Professor Oak,Item Finder,Lass,Pokémon Breeder,Pokémon Trader,Scoop Up,Super Energy Removal,Defender,Energy Retrieval,Full Heal,Maintenance,PlusPower,Pokémon Center,Pokémon Flute,Pokédex,Professor Oak,Revive,Super Potion,Bill,Energy Removal,Gust of Wind,Potion,Switch,Double Colorless Energy,Fighting Energy,Fire Energy,Grass Energy,Lightning Energy,Psychic Energy,Water Energy".split(",");
const cards=NAMES.map((n,i)=>({n,num:i+1}));
const GROUPS=[["Pokémon",1,69],["Trainer",70,95],["Energy",96,102]];
const KEY="basesetOwned";
let owned=new Set();
try{owned=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){}
let filter="all";
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...owned]))}catch(e){}};
const main=document.getElementById("main");

function render(){
  main.innerHTML="";
  let shown=0;
  for(const [g,a,b] of GROUPS){
    const list=cards.filter(c=>c.num>=a&&c.num<=b&&(filter==="all"||(filter==="have")===owned.has(c.num)));
    if(!list.length)continue;
    shown+=list.length;
    const h=document.createElement("div");h.className="group";h.textContent=g;main.append(h);
    const grid=document.createElement("div");grid.className="grid";
    for(const c of list){
      const el=document.createElement("button");
      el.className="c"+(owned.has(c.num)?" have":"");
      el.dataset.n=c.num;
      el.innerHTML=`<div class="img" style="background-image:url(https://images.pokemontcg.io/base1/${c.num}.png)"></div>`+
        (c.num<=16?`<span class="holo">HOLO</span>`:"")+
        `<span class="tick">${owned.has(c.num)?"✓":"✗"}</span>`+
        `<div class="meta"><b>${c.num}/102</b><span>${c.n}</span></div>`;
      grid.append(el);
    }
    main.append(grid);
  }
  if(!shown)main.innerHTML=`<div class="empty">${filter==="need"?"You have them all! 🎉":"Nothing here yet."}</div>`;
  document.getElementById("count").textContent=`${owned.size} / 102`;
  document.getElementById("fill").style.width=owned.size/102*100+"%";
}

main.addEventListener("click",e=>{
  const el=e.target.closest(".c");if(!el)return;
  if(longPressed){longPressed=false;return;}
  const n=+el.dataset.n;
  owned.has(n)?owned.delete(n):owned.add(n);
  save();
  if(filter==="all"){
    el.classList.toggle("have");
    el.querySelector(".tick").textContent=owned.has(n)?"✓":"✗";
    document.getElementById("count").textContent=`${owned.size} / 102`;
    document.getElementById("fill").style.width=owned.size/102*100+"%";
    if(navigator.vibrate)navigator.vibrate(8);
  }else render();
});
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  filter=b.dataset.f;
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));
  render();window.scrollTo(0,0);
});
document.getElementById("exp").onclick=async()=>{
  const t=cards.filter(c=>!owned.has(c.num)).map(c=>`${c.num} ${c.n}`).join("\n");
  try{await navigator.clipboard.writeText("Base Set cards needed:\n"+t);alert("Need-list copied")}catch(e){prompt("Copy:",t)}
};
document.getElementById("rst").onclick=()=>{
  if(confirm("Clear all cards you've marked as owned?")){owned.clear();save();render()}
};
// ── Pricing sheet ──────────────────────────────────────────────
const PKMN_API_KEY="pk_b61d351df31cc86b7fca82097d12945093bf114daed226a5";
const BASE_SET_ID=463;
const overlay=document.getElementById("overlay");
const sheet=document.getElementById("sheet");
const sheetBody=document.getElementById("sheet-body");
const cardIdCache={};

function closeSheet(){
  sheet.classList.remove("show");
  overlay.classList.remove("show");
}

overlay.addEventListener("click",closeSheet);

function fmt(v){return v!=null?"$"+v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}):null}

function renderSheet(state){
  const isHolo=state.cardNum<=16;
  if(state.loading){
    sheetBody.innerHTML=`<div class="sheet-loading">Loading prices…</div>`;
    return;
  }
  if(state.error){
    sheetBody.innerHTML=`<div class="sheet-error">Couldn't load prices. Try again.</div>`;
    return;
  }
  const condMap={"Near Mint":"NM","Lightly Played":"LP","Moderately Played":"MP"};
  const rawPrices={NM:null,LP:null,MP:null};
  for(const p of (state.prices||[])){
    const lbl=condMap[p.condition];
    if(lbl&&rawPrices[lbl]===null)rawPrices[lbl]=p.market_price;
  }
  const priceCell=(lbl,val)=>`<div class="price-cell"><div class="label">${lbl}</div><div class="amount${val==null?" nil":""}">${val!=null?fmt(val):"—"}</div></div>`;
  const gradedCell=(lbl)=>`<div class="price-cell grade"><div class="label">${lbl}</div><div class="amount nil">—</div></div>`;
  sheetBody.innerHTML=`
    <div class="sheet-head">
      <div class="sheet-img" style="background-image:url(https://images.pokemontcg.io/base1/${state.cardNum}.png)"></div>
      <div class="sheet-info">
        <h2>${state.cardName}</h2>
        <p>${state.cardNum}/102 · Base Set${isHolo?" · Holo Rare":""}</p>
        ${isHolo?'<span class="sheet-badge">Holographic</span>':""}
      </div>
    </div>
    <div class="sheet-section">
      <h3>Raw Prices (TCGPlayer)</h3>
      <div class="price-row">
        ${priceCell("NM",rawPrices.NM)}
        ${priceCell("LP",rawPrices.LP)}
        ${priceCell("MP",rawPrices.MP)}
      </div>
    </div>
    <div class="sheet-section">
      <h3>Graded (PSA)</h3>
      <div class="graded-row">
        ${gradedCell("PSA 10")}${gradedCell("PSA 9")}${gradedCell("PSA 8")}
      </div>
      <div class="graded-row last">
        ${gradedCell("PSA 7")}${gradedCell("PSA 6")}
      </div>
      <div class="pro-note">PSA graded prices require a <a href="https://pkmnprices.com/pricing" target="_blank">Pro plan</a> on pkmnprices</div>
    </div>`;
}

async function openPricing(cardNum){
  if(navigator.vibrate)navigator.vibrate(20);
  sheetBody.innerHTML=`<div class="sheet-loading">Loading prices…</div>`;
  overlay.classList.add("show");
  sheet.classList.add("show");
  try{
    let cardId=cardIdCache[cardNum];
    if(!cardId){
      const r=await fetch(`https://api.pkmnprices.com/v1/cards?set_id=${BASE_SET_ID}&number=${cardNum}&per_page=1`,
        {headers:{"X-API-Key":PKMN_API_KEY}});
      const d=await r.json();
      if(!d.data?.length)throw new Error("not found");
      cardId=d.data[0].id;
      cardIdCache[cardNum]=cardId;
    }
    const r2=await fetch(`https://api.pkmnprices.com/v1/cards/${cardId}`,
      {headers:{"X-API-Key":PKMN_API_KEY}});
    const detail=await r2.json();
    renderSheet({cardNum,cardName:NAMES[cardNum-1],prices:detail.prices});
  }catch(e){
    renderSheet({cardNum,cardName:NAMES[cardNum-1],error:true});
  }
}

// Long-press detection
let pressTimer=null;
let longPressed=false;
const LONG_MS=500;

function onTouchStart(e){
  const el=e.target.closest(".c");if(!el)return;
  longPressed=false;
  pressTimer=setTimeout(()=>{
    pressTimer=null;
    longPressed=true;
    openPricing(+el.dataset.n);
  },LONG_MS);
}
function cancelPress(){
  if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}
}
main.addEventListener("touchstart",onTouchStart,{passive:true});
main.addEventListener("touchend",cancelPress,{passive:true});
main.addEventListener("touchmove",cancelPress,{passive:true});
// Desktop: right-click / long-press context menu
main.addEventListener("contextmenu",e=>{
  const el=e.target.closest(".c");if(!el)return;
  e.preventDefault();
  openPricing(+el.dataset.n);
});

render();
</script>
</body>
</html>
