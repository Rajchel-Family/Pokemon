<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Base Set">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14161c">
<title>Base Set Tracker</title>
<style>
  :root{--bg:#14161c;--card:#1e222b;--line:#2c313c;--text:#f2f4f8;--dim:#8b93a3;--have:#2ecc71;--need:#e74c3c;--accent:#ffcb05}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px 8px;border-bottom:1px solid var(--line)}
  h1{font-size:18px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
  h1 small{color:var(--dim);font-weight:500;font-size:13px}
  .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
  .bar>div{height:100%;background:var(--have);width:0;transition:width .25s}
  .tabs{display:flex;gap:6px;margin-top:10px}
  .tabs button{flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--dim);font-size:14px;font-weight:600}
  .tabs button.on{background:var(--accent);color:#111;border-color:var(--accent)}
  .group{padding:12px 14px 0;color:var(--dim);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 14px}
  .c{position:relative;background:var(--card);border:2px solid var(--need);border-radius:12px;padding:0;color:var(--text);text-align:center;overflow:hidden;min-height:128px;display:flex;flex-direction:column}
  .c.have{border-color:var(--have)}
  .c .img{flex:1;background:#0d0f13 center/cover no-repeat;min-height:92px;filter:grayscale(1) brightness(.45);transition:filter .2s}
  .c.have .img{filter:none}
  .c .meta{padding:5px 4px;font-size:11px;line-height:1.2}
  .c .meta b{display:block;color:var(--dim);font-size:11px}
  .c .meta span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c .tick{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:var(--need);color:#fff;font-size:13px;line-height:22px;font-weight:800}
  .c.have .tick{background:var(--have)}
  .holo{position:absolute;top:4px;left:4px;background:var(--accent);color:#111;font-size:9px;font-weight:800;padding:2px 5px;border-radius:6px}
  .empty{padding:30px;text-align:center;color:var(--dim)}
  footer{padding:18px 14px calc(24px + env(safe-area-inset-bottom));text-align:center}
  footer button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:8px 12px;font-size:12px;margin:0 4px}
</style>
</head>
<body>
<header>
  <h1>Base Set <small id="count"></small></h1>
  <div class="bar"><div id="fill"></div></div>
  <div class="tabs" id="tabs">
    <button data-f="all" class="on">All</button>
    <button data-f="need">Need</button>
    <button data-f="have">Have</button>
  </div>
</header>
<main id="main"></main>
<footer>
  <button id="exp">Copy need-list</button>
  <button id="rst">Reset</button>
</footer>
<script>
const NAMES="Alakazam,Blastoise,Chansey,Charizard,Clefairy,Gyarados,Hitmonchan,Machamp,Magneton,Mewtwo,Nidoking,Ninetales,Poliwrath,Raichu,Venusaur,Zapdos,Beedrill,Dragonair,Dugtrio,Electabuzz,Electrode,Pidgeotto,Arcanine,Charmeleon,Dewgong,Dratini,Farfetch'd,Growlithe,Haunter,Ivysaur,Jynx,Kadabra,Kakuna,Machoke,Magikarp,Magmar,Nidorino,Poliwhirl,Porygon,Raticate,Seel,Wartortle,Abra,Bulbasaur,Caterpie,Charmander,Diglett,Doduo,Drowzee,Gastly,Koffing,Machop,Magnemite,Metapod,Nidoran ♂,Onix,Pidgey,Pikachu,Poliwag,Ponyta,Rattata,Sandshrew,Squirtle,Starmie,Staryu,Tangela,Voltorb,Vulpix,Weedle,Clefairy Doll,Computer Search,Devolution Spray,Impostor Professor Oak,Item Finder,Lass,Pokémon Breeder,Pokémon Trader,Scoop Up,Super Energy Removal,Defender,Energy Retrieval,Full Heal,Maintenance,PlusPower,Pokémon Center,Pokémon Flute,Pokédex,Professor Oak,Revive,Super Potion,Bill,Energy Removal,Gust of Wind,Potion,Switch,Double Colorless Energy,Fighting Energy,Fire Energy,Grass Energy,Lightning Energy,Psychic Energy,Water Energy".split(",");
const cards=NAMES.map((n,i)=>({n,num:i+1}));
const GROUPS=[["Pokémon",1,69],["Trainer",70,95],["Energy",96,102]];
const KEY="basesetOwned";
let owned=new Set();
try{owned=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){}
let filter="all";
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...owned]))}catch(e){}};
const main=document.getElementById("main");

function render(){
  main.innerHTML="";
  let shown=0;
  for(const [g,a,b] of GROUPS){
    const list=cards.filter(c=>c.num>=a&&c.num<=b&&(filter==="all"||(filter==="have")===owned.has(c.num)));
    if(!list.length)continue;
    shown+=list.length;
    const h=document.createElement("div");h.className="group";h.textContent=g;main.append(h);
    const grid=document.createElement("div");grid.className="grid";
    for(const c of list){
      const el=document.createElement("button");
      el.className="c"+(owned.has(c.num)?" have":"");
      el.dataset.n=c.num;
      el.innerHTML=`<div class="img" style="background-image:url(https://images.pokemontcg.io/base1/${c.num}.png)"></div>`+
        (c.num<=16?`<span class="holo">HOLO</span>`:"")+
        `<span class="tick">${owned.has(c.num)?"✓":"✗"}</span>`+
        `<div class="meta"><b>${c.num}/102</b><span>${c.n}</span></div>`;
      grid.append(el);
    }
    main.append(grid);
  }
  if(!shown)main.innerHTML=`<div class="empty">${filter==="need"?"You have them all! 🎉":"Nothing here yet."}</div>`;
  document.getElementById("count").textContent=`${owned.size} / 102`;
  document.getElementById("fill").style.width=owned.size/102*100+"%";
}

main.addEventListener("click",e=>{
  const el=e.target.closest(".c");if(!el)return;
  const n=+el.dataset.n;
  owned.has(n)?owned.delete(n):owned.add(n);
  save();
  if(filter==="all"){
    el.classList.toggle("have");
    el.querySelector(".tick").textContent=owned.has(n)?"✓":"✗";
    document.getElementById("count").textContent=`${owned.size} / 102`;
    document.getElementById("fill").style.width=owned.size/102*100+"%";
    if(navigator.vibrate)navigator.vibrate(8);
  }else render();
});
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  filter=b.dataset.f;
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));
  render();window.scrollTo(0,0);
});
document.getElementById("exp").onclick=async()=>{
  const t=cards.filter(c=>!owned.has(c.num)).map(c=>`${c.num} ${c.n}`).join("\n");
  try{await navigator.clipboard.writeText("Base Set cards needed:\n"+t);alert("Need-list copied")}catch(e){prompt("Copy:",t)}
};
document.getElementById("rst").onclick=()=>{
  if(confirm("Clear all cards you've marked as owned?")){owned.clear();save();render()}
};
render();
</script>
</body>
</html>
