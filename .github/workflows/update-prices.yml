name: Update Card Prices

on:
  schedule:
    - cron: '0 7 * * *'   # Daily at 7am UTC
  workflow_dispatch:        # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch prices
        env:
          PKMN_API_KEY: ${{ secrets.PKMN_API_KEY }}
        run: python3 scripts/fetch_prices.py

      - name: Commit prices.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet && echo "No price changes" || git commit -m "Update Base Set prices [skip ci]"
          git push
